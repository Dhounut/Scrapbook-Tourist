<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Scrapbook</title>
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="scrapbook.css">
</head>
<body>
  <div class="board">
    <header class="head">
      <h1>My Scrapbook</h1>
      <p class="sub">A collection of places I've been</p>
    </header>

    <div id="wall" class="wall" tabindex="0"></div>

    <div id="empty" class="empty" hidden>
      <p>No photos yet!</p>
      <p class="hint">Browse some websites and I'll start snapping.</p>
    </div>
  </div>

  <template id="tpl">
    <div class="slot">
      <div class="pic">
        <img>
        <div class="date"></div>
        <div class="cap"></div>
        <div class="del"></div>
      </div>
    </div>
  </template>

  <script src="scrapbook.js"></script>
</body>
</html>
